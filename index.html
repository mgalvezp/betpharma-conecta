<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#d71920">

  <title>BET PHARMA CONECTA</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;

      display: grid;
      place-items: center;

      padding: 24px;

      font-family: Arial, Helvetica, sans-serif;

      background:
        radial-gradient(
          circle at top right,
          rgba(215, 25, 32, 0.10),
          transparent 35%
        ),
        #f5f7fa;

      color: #20242a;
    }

    .card {
      width: min(580px, 100%);

      padding: 42px 32px;

      background: #ffffff;

      border: 1px solid #e5e7eb;
      border-radius: 24px;

      box-shadow:
        0 18px 45px
        rgba(15, 23, 42, 0.10);

      text-align: center;
    }

    .logo {
      width: 66px;
      height: 66px;

      margin: 0 auto 18px;

      display: grid;
      place-items: center;

      border-radius: 18px;

      background: #d71920;
      color: white;

      font-size: 30px;
      font-weight: 900;
    }

    .eyebrow {
      color: #d71920;

      font-weight: 900;
      font-size: 12px;

      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    h1 {
      margin: 10px 0 12px;

      font-size: clamp(
        34px,
        7vw,
        50px
      );

      line-height: 1;
    }

    p {
      max-width: 470px;

      margin: 0 auto 24px;

      color: #6b7280;

      line-height: 1.6;
    }

    .button {
      display: inline-block;

      padding: 14px 22px;

      border-radius: 14px;

      background: #d71920;
      color: #ffffff;

      text-decoration: none;

      font-weight: 900;

      box-shadow:
        0 8px 20px
        rgba(215, 25, 32, 0.22);
    }

    .button:hover {
      background: #aa1117;
    }

    .note {
      margin-top: 20px;

      color: #9ca3af;

      font-size: 12px;
    }
  </style>
</head>

<body>

  <main class="card">

    <div class="logo">
      ✚
    </div>

    <div class="eyebrow">
      BET PHARMA
    </div>

    <h1>
      CONECTA
    </h1>

    <p>
      Fidelización, productos,
      campañas inteligentes
      y gestión comercial
      en un solo lugar.
    </p>

    <a
      class="button"
      href="https://script.google.com/macros/s/AKfycbxAHDXcODK7TTedykyWjRAvne7vBBBXfM-2g5Ghm_6Zo5FSfwcTGiI5Hu1lFn16uF-Pdg/exec"
    >
      Entrar a BET PHARMA CONECTA
    </a>

    <div class="note">
      La aplicación se ejecuta mediante
      Google Apps Script.
    </div>

  </main>

</body>
</html>
